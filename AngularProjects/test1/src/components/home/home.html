<!-- Hero Section -->
<section style="text-align: center; padding: 60px 20px; background: #f8fafc">
    <h1>Welcome to My Angular Project 👋</h1>
</section>
<section style="text-align: center; padding: 20px">
    <div class="d-flex justify-content-end">
        <button class="btn btn-info">Add Category</button>
    </div>
    <div class="container mt-4">
        <h4>Add Category</h4>

        <form class="row g-3 align-items-center">
            <div class="col-auto">
                <input type="text" class="form-control" id="categoryId" placeholder="ID" />
            </div>

            <div class="col-auto">
                <input type="text" class="form-control" id="categoryName" placeholder="Name" />
            </div>

            <div class="col-auto">
                <input type="text" class="form-control" id="categoryDescription" placeholder="Description" />
            </div>

            <div class="col-auto mt-4">
                <input type="checkbox" class="form-check-input" id="isActive" />
                <label class="form-check-label ms-1" for="isActive">Active</label>
            </div>

            <div class="col-auto mt-4">
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </form>
    </div>
</section>
<!-- Cards Section -->
<section style="padding: 40px; display: flex; gap: 20px; justify-content: center">
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Description</th>
                <th>Is Active</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of items">
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.description }}</td>
                <td>{{ item.isAction ? 'Yes' : 'No' }}</td>
                <td>
                    <!-- <button (click)="editItem(item.id)">Edit</button> -->
                    <button (click)="deleteItem(item.id)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>
</section>
