<section style="max-width: 800px; margin: auto; padding: 30px;">

    <h2>Get in Touch</h2>
    <p>Please fill out the form below and we will get back to you shortly.</p>

    <!-- Contact Form -->
    <form style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">

        <label>
            Full Name
            <input type="text" placeholder="Enter your name"
                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;" />
        </label>

        <label>
            Email
            <input type="email" placeholder="Enter your email"
                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;" />
        </label>

        <label>
            Message
            <textarea rows="5" placeholder="Write your message here..."
                style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; resize: none;"></textarea>
        </label>

        <button type="submit"
            style="padding: 12px; background: #ffc107; border: none; color: black; font-size: 16px; border-radius: 6px; cursor: pointer;">
            Send Message
        </button>

    </form>

    <!-- Info Section -->
    <div style="margin-top: 30px;">
        <h3>Other Ways to Connect</h3>
        <p><strong>Email:</strong> support@example.com</p>
        <p><strong>Phone:</strong> +91 98765 43210</p>
        <p><strong>Location:</strong> Nagpur, Maharashtra 🇮🇳</p>
    </div>

</section>
